name: Publish

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
    workflow_dispatch:

env:
    DEBUG: 'napi:*'
    MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Clippy
              run: cargo clippy

    build:
        runs-on: ubuntu-latest

        # Run in ubuntu:20.04 container to avoid the issue with glibc version
        container:
            image: ubuntu:20.04

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            # ubuntu:20.04 does not have curl and gcc/g++ installed by default
            - run: apt-get update && apt-get install -y curl build-essential

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  targets: x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu

            - uses: Swatinem/rust-cache@v2

            - run: cargo install cargo-xwin

            - name: Node install
              run: npm ci

            - name: Build Linux
              run: npm run build -- --target x86_64-unknown-linux-gnu

            - name: Build Windows
              run: npm run build -- --target x86_64-pc-windows-msvc

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: binaries-windows-linux
                  path: dist
                  if-no-files-found: error

    build-mac:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  targets: x86_64-apple-darwin, aarch64-apple-darwin

            - uses: Swatinem/rust-cache@v2

            - name: Node install
              run: npm ci

            - name: Build Mac x64
              run: npm run build -- --target x86_64-apple-darwin

            - name: Build Mac arm64
              run: npm run build -- --target aarch64-apple-darwin

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: binaries-macos
                  path: dist
                  if-no-files-found: error

    release:
        # Release only from this repository, and only for a version tag or a
        # manual dispatch. An ordinary push to main builds but does not release.
        if: ${{ github.repository == 'crimson-med/cozy-steamworks' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}

        runs-on: ubuntu-latest
        needs: [build, build-mac]

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Download build
              uses: actions/download-artifact@v4
              with:
                  path: dist/
                  pattern: binaries-*
                  merge-multiple: true

            - name: Verify all targets are present
              run: |
                  ls -R dist
                  for f in \
                      dist/win64/steamworksjs.win32-x64-msvc.node \
                      dist/linux64/steamworksjs.linux-x64-gnu.node \
                      dist/osx/steamworksjs.darwin-x64.node \
                      dist/osx/steamworksjs.darwin-arm64.node; do
                      test -f "$f" || { echo "missing $f"; exit 1; }
                  done

            - name: Resolve version and tag
              id: meta
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                      TAG="${GITHUB_REF_NAME}"
                      test "$TAG" = "v$VERSION" || { echo "tag $TAG does not match package.json version $VERSION"; exit 1; }
                  else
                      TAG="v$VERSION"
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Pack tarball
              id: pack
              run: |
                  FILE=$(npm pack --silent)
                  echo "file=$FILE" >> "$GITHUB_OUTPUT"
                  tar -tzf "$FILE" | grep -E 'dist/.*\.node$'

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TAG="${{ steps.meta.outputs.tag }}"
                  FILE="${{ steps.pack.outputs.file }}"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release upload "$TAG" "$FILE" --clobber
                  else
                      gh release create "$TAG" "$FILE" \
                          --target "$GITHUB_SHA" \
                          --title "$TAG" \
                          --notes "Install with: npm i https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$FILE"
                  fi
